<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background Card -->
  <rect width="800" height="600" rx="40" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Background Circles -->
  <circle cx="700" cy="100" r="180" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="100" cy="500" r="220" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="680" cy="480" r="120" fill="#f59e0b" fill-opacity="0.1"/>

  <!-- Main House / Service Base Platform -->
  <g filter="url(#shadow)">
    <!-- House Structure -->
    <path d="M 220 250 L 400 120 L 580 250 L 580 440 C 580 453.25 569.25 464 556 464 L 244 464 C 230.75 464 220 453.25 220 440 Z" fill="url(#cardGrad)"/>
    <!-- Roof Shadow/Highlight Overlay -->
    <path d="M 195 260 L 400 110 L 605 260" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 260 L 400 110 L 605 260" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>

    <!-- Main Entrance Door -->
    <rect x="350" y="340" width="100" height="124" rx="16" fill="url(#tealGrad)"/>
    <circle cx="430" cy="405" r="6" fill="#f59e0b"/>

    <!-- Windows with Soft Glow -->
    <rect x="260" y="290" width="64" height="64" rx="12" fill="#ccfbf1"/>
    <line x1="292" y1="290" x2="292" y2="354" stroke="#0d9488" stroke-width="3"/>
    <line x1="260" y1="322" x2="324" y2="322" stroke="#0d9488" stroke-width="3"/>

    <rect x="476" y="290" width="64" height="64" rx="12" fill="#ccfbf1"/>
    <line x1="508" y1="290" x2="508" y2="354" stroke="#0d9488" stroke-width="3"/>
    <line x1="476" y1="322" x2="540" y2="322" stroke="#0d9488" stroke-width="3"/>
  </g>

  <!-- Floating Badge 1: Verification Shield -->
  <g transform="translate(100, 160)" filter="url(#shadow)">
    <rect width="180" height="64" rx="32" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="36" cy="32" r="20" fill="#0d9488"/>
    <path d="M 30 32 L 34 36 L 43 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#0f172a">Verified Pros</text>
    <text x="68" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">100% Background Checked</text>
  </g>

  <!-- Floating Badge 2: Rating Pill -->
  <g transform="translate(520, 140)" filter="url(#shadow)">
    <rect width="170" height="64" rx="32" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="36" cy="32" r="20" fill="url(#accentGrad)"/>
    <path d="M 36 21 L 39.5 28 L 47 29 L 41.5 34.5 L 43 42 L 36 38 L 29 42 L 30.5 34.5 L 25 29 L 32.5 28 Z" fill="#ffffff"/>
    <text x="68" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#0f172a">4.9 / 5.0</text>
    <text x="68" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Top Rated Service</text>
  </g>

  <!-- Floating Badge 3: Wrench & Gear Tools Icon Badge -->
  <g transform="translate(560, 360)" filter="url(#shadow)">
    <circle cx="44" cy="44" r="44" fill="#ffffff"/>
    <circle cx="44" cy="44" r="36" fill="url(#tealGrad)"/>
    <path d="M 34 30 L 44 40 M 44 30 L 34 40 M 48 50 L 58 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="44" r="6" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Bottom Brand Ribbon -->
  <g transform="translate(250, 495)" filter="url(#shadow)">
    <rect width="300" height="54" rx="27" fill="#ffffff" fill-opacity="0.95"/>
    <text x="150" y="33" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#0d9488" letter-spacing="0.5">FIX IT NOW SERVICES</text>
  </g>
</svg>

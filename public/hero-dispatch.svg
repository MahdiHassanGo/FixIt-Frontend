<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="heroDarkBg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16092b"/>
      <stop offset="50%" stop-color="#260c46"/>
      <stop offset="100%" stop-color="#0c0418"/>
    </linearGradient>
    <linearGradient id="mainCardGrad" x1="0" y1="0" x2="520" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#250f44"/>
      <stop offset="100%" stop-color="#120722"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="orangeFlame" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="purpleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff6b00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" rx="36" fill="url(#heroDarkBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="700" cy="120" r="180" fill="#8b5cf6" fill-opacity="0.25"/>
  <circle cx="120" cy="500" r="200" fill="#ff6b00" fill-opacity="0.2"/>
  <circle cx="400" cy="300" r="250" fill="#6d28d9" fill-opacity="0.1"/>

  <!-- Background Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>

  <!-- Central Main FixItNow Service Marketplace Board (NO BUTTON, NO HOUSE, CLEAN XML) -->
  <g transform="translate(140, 100)" filter="url(#purpleShadow)">
    <!-- Dashboard Frame -->
    <rect width="520" height="400" rx="28" fill="url(#mainCardGrad)" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Top Window Controls & App Title -->
    <rect width="520" height="56" rx="28" fill="#1b0a33" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="32" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="28" r="6" fill="#27c93f"/>

    <rect x="120" y="14" width="280" height="28" rx="14" fill="#290e4a" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <circle cx="136" cy="28" r="4" fill="#ff6b00"/>
    <text x="150" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#c084fc" letter-spacing="0.5">FIXITNOW // HOME SERVICE MARKETPLACE</text>

    <!-- Category Pills Bar inside Marketplace Card -->
    <g transform="translate(24, 72)">
      <!-- Plumbing Pill -->
      <rect width="104" height="32" rx="16" fill="#290e4a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="52" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">Plumbing</text>

      <!-- Electrical Pill -->
      <rect x="114" width="104" height="32" rx="16" fill="#290e4a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="166" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">Electrical</text>

      <!-- Cleaning Pill -->
      <rect x="228" width="104" height="32" rx="16" fill="#290e4a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="280" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">Cleaning</text>

      <!-- Painting Pill -->
      <rect x="342" width="104" height="32" rx="16" fill="#290e4a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="394" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">Painting</text>
    </g>

    <!-- Main Technician & Service Booking Preview Card -->
    <g transform="translate(24, 120)">
      <rect width="472" height="246" rx="22" fill="#160829" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3"/>

      <!-- Pro Avatar Badge -->
      <g transform="translate(20, 20)">
        <circle cx="28" cy="28" r="28" fill="url(#purpleGlow)"/>
        <circle cx="28" cy="28" r="24" fill="#250f44"/>
        <!-- Crossed Tools Icon -->
        <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#ff6b00" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="28" cy="28" r="4" fill="#ffffff"/>
      </g>

      <!-- Technician Info -->
      <text x="88" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="17" fill="#ffffff">Verified Home Technician</text>
      <text x="88" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ff6b00">Licensed Repair &amp; Maintenance Specialist</text>

      <!-- Grid Module 1: Rating & Reviews -->
      <g transform="translate(20, 92)">
        <rect width="210" height="60" rx="14" fill="#250f44" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
        <text x="14" y="26" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ff6b00">4.9 Star Rating</text>
        <text x="14" y="44" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#c084fc">Over 500+ Verified Reviews</text>
      </g>

      <!-- Grid Module 2: Stripe Protection & Guarantee -->
      <g transform="translate(242, 92)">
        <rect width="210" height="60" rx="14" fill="#250f44" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
        <text x="14" y="26" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff">Stripe Checkout</text>
        <text x="14" y="44" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#22c55e">Verified Secure Payment</text>
      </g>

      <!-- Booking Time Slot Bar Preview -->
      <g transform="translate(20, 166)">
        <rect width="432" height="60" rx="16" fill="#250f44" stroke="#ff6b00" stroke-width="1.5" stroke-opacity="0.4"/>
        <circle cx="28" cy="30" r="12" fill="url(#orangeFlame)"/>
        <!-- Calendar icon vector paths -->
        <rect x="22" y="24" width="12" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="22" y1="27" x2="34" y2="27" stroke="#ffffff" stroke-width="1.5"/>

        <text x="52" y="27" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff">Available Slot: Today @ 2:00 PM</text>
        <text x="52" y="45" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ff6b00">Instant Online Booking &amp; Track Status</text>
      </g>
    </g>
  </g>

  <!-- Floating Card 1: Certified Pros (Top Left) -->
  <g transform="translate(30, 130)" filter="url(#purpleShadow)">
    <rect width="220" height="64" rx="32" fill="#140726" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="34" cy="32" r="18" fill="url(#purpleGlow)"/>
    <path d="M 28 32 L 32 36 L 41 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="30" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff">Certified Pros</text>
    <text x="64" y="46" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ff6b00">100% Background Checked</text>
  </g>

  <!-- Floating Card 2: Real-Time Booking Tracking (Bottom Right) -->
  <g transform="translate(540, 430)" filter="url(#orangeGlow)">
    <rect width="210" height="64" rx="32" fill="#140726" stroke="#ff6b00" stroke-width="2"/>
    <circle cx="34" cy="32" r="18" fill="url(#orangeFlame)"/>
    <circle cx="34" cy="32" r="7" fill="#ffffff"/>
    <text x="64" y="30" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff">Track Bookings</text>
    <text x="64" y="46" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#c084fc">Real-time Dashboard</text>
  </g>

  <!-- Floating Target Tool Gear Badge (Top Right) -->
  <g transform="translate(640, 120)" filter="url(#purpleShadow)">
    <circle cx="36" cy="36" r="36" fill="#140726" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="36" cy="36" r="28" fill="url(#purpleGlow)"/>
    <circle cx="36" cy="36" r="10" stroke="#ffffff" stroke-width="3.5" fill="none"/>
    <path d="M 36 18 L 36 24 M 36 48 L 36 54 M 18 36 L 24 36 M 48 36 L 54 36" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>

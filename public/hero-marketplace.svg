<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Dark Purple & Obsidian Background Gradients -->
    <linearGradient id="heroDarkBg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140826"/>
      <stop offset="50%" stop-color="#240b45"/>
      <stop offset="100%" stop-color="#0a0316"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#210d3e"/>
      <stop offset="100%" stop-color="#110622"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="285" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c1152"/>
      <stop offset="100%" stop-color="#1a0933"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="orangeFlame" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Professional Soft Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#ff6b00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" rx="36" fill="url(#heroDarkBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="720" cy="100" r="180" fill="#8b5cf6" fill-opacity="0.2"/>
  <circle cx="100" cy="520" r="200" fill="#ff6b00" fill-opacity="0.18"/>

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5">
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- MAIN WINDOW CONTAINER (NO OVERLAPPING BADGES) -->
  <g transform="translate(80, 50)" filter="url(#softShadow)">
    <!-- Main Window Shell -->
    <rect width="640" height="490" rx="28" fill="url(#windowGrad)" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.35"/>

    <!-- Window Top Header Bar -->
    <rect width="640" height="52" rx="28" fill="#18092d" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="28" cy="26" r="5.5" fill="#ff5f56"/>
    <circle cx="46" cy="26" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="26" r="5.5" fill="#27c93f"/>

    <!-- Search Input Bar Preview -->
    <rect x="100" y="12" width="300" height="28" rx="14" fill="#290e4e" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <circle cx="116" cy="26" r="6" stroke="#c084fc" stroke-width="1.5" fill="none"/>
    <line x1="120" y1="30" x2="124" y2="34" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>
    <text x="134" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#c084fc">Search plumbing, electrical, cleaning...</text>

    <!-- Top Window Pill Badge -->
    <rect x="450" y="14" width="165" height="24" rx="12" fill="#ff6b00" fill-opacity="0.2" stroke="#ff6b00" stroke-width="1"/>
    <text x="532" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#ff6b00" letter-spacing="0.5">FIXITNOW MARKETPLACE</text>

    <!-- TWO-COLUMN PROFESSIONAL CONTENT AREA -->
    <!-- LEFT CARD: Featured Service Listing -->
    <g transform="translate(24, 72)">
      <rect width="285" height="320" rx="20" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3"/>

      <!-- Service Banner Graphic -->
      <rect width="285" height="110" rx="20" fill="#361366"/>
      <!-- Wrench & Bolt Vector Graphic inside Banner -->
      <path d="M 120 40 L 165 75 M 165 40 L 120 75" stroke="#ff6b00" stroke-width="5" stroke-linecap="round"/>
      <circle cx="142" cy="57" r="14" fill="#ff6b00" fill-opacity="0.3" stroke="#ff6b00" stroke-width="3"/>

      <!-- Category Pill Overlay -->
      <rect x="12" y="12" width="115" height="24" rx="12" fill="#140726" stroke="#8b5cf6" stroke-width="1"/>
      <text x="70" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#c084fc">PLUMBING &amp; FIX</text>

      <!-- Rating Badge Overlay -->
      <rect x="215" y="12" width="58" height="24" rx="12" fill="#140726" stroke="#ff6b00" stroke-width="1"/>
      <text x="244" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#ff6b00">4.9 Star</text>

      <!-- Service Card Details -->
      <text x="16" y="142" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff">Master Pipe Repair &amp; Leak Fix</text>
      <text x="16" y="162" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ff6b00">By Alex Vance • Certified Specialist</text>
      <text x="16" y="184" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#a855f7">Location: Downtown &amp; Metro Area</text>
      <text x="16" y="204" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Fast 24/7 Service Dispatch Available</text>

      <!-- Divider -->
      <line x1="16" y1="222" x2="269" y2="222" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1"/>

      <!-- Pricing & Booking Button Row -->
      <text x="16" y="258" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff">$65.00</text>
      <text x="16" y="274" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#a855f7">Starting Price</text>

      <g transform="translate(155, 242)" filter="url(#orangeGlow)">
        <rect width="114" height="38" rx="14" fill="url(#orangeFlame)"/>
        <text x="57" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff">Book Now →</text>
      </g>
    </g>

    <!-- RIGHT CARD: Verified Technician Profile -->
    <g transform="translate(331, 72)">
      <rect width="285" height="320" rx="20" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3"/>

      <!-- Pro Avatar Header -->
      <g transform="translate(16, 16)">
        <circle cx="28" cy="28" r="28" fill="url(#purpleGlow)"/>
        <circle cx="28" cy="28" r="24" fill="#210d3e"/>
        <!-- Shield Icon inside Avatar -->
        <path d="M 28 16 L 36 20 L 36 28 C 36 34 28 40 28 40 C 28 40 20 34 20 28 L 20 20 Z" fill="#ff6b00"/>
        <path d="M 25 28 L 27 30 L 31 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="82" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff">Sarah Jenkins</text>
      <text x="82" y="56" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ff6b00">Electrical &amp; Wiring Expert</text>

      <!-- Stats Grid -->
      <g transform="translate(16, 82)">
        <!-- Stat 1 -->
        <rect width="120" height="52" rx="12" fill="#1d0a38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
        <text x="12" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff">8+ Years</text>
        <text x="12" y="40" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#a855f7">Field Experience</text>

        <!-- Stat 2 -->
        <g transform="translate(133, 0)">
          <rect width="120" height="52" rx="12" fill="#1d0a38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
          <text x="12" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ff6b00">340+ Fixes</text>
          <text x="12" y="40" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#a855f7">Completed Jobs</text>
        </g>
      </g>

      <!-- Availability Box -->
      <g transform="translate(16, 148)">
        <rect width="253" height="44" rx="12" fill="#1d0a38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
        <circle cx="22" cy="22" r="5" fill="#22c55e"/>
        <text x="36" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">Available Today @ 3:00 PM</text>
      </g>

      <!-- Payment & Security Box -->
      <g transform="translate(16, 204)">
        <rect width="253" height="44" rx="12" fill="#1d0a38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
        <text x="14" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#c084fc">Stripe Encrypted Payment</text>
        <text x="180" y="26" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#22c55e">✓ Protected</text>
      </g>

      <!-- Verified Technician Badge Footer -->
      <g transform="translate(16, 260)">
        <rect width="253" height="44" rx="12" fill="#ff6b00" fill-opacity="0.15" stroke="#ff6b00" stroke-opacity="0.4"/>
        <text x="126" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ff6b00">Verified Pro • 100% Satisfaction</text>
      </g>
    </g>

    <!-- BOTTOM SUMMARY BAR -->
    <g transform="translate(24, 412)">
      <rect width="592" height="54" rx="18" fill="#18092d" stroke="#ff6b00" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="28" cy="27" r="10" fill="url(#orangeFlame)"/>
      <path d="M 24 27 L 27 30 L 32 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="25" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">Instant Online Booking Confirmed</text>
      <text x="48" y="40" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ff6b00">Select Date &amp; Time Slot • Track Repair Status on Customer Dashboard</text>

      <text x="560" y="32" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#c084fc">FIXITNOW PRO →</text>
    </g>
  </g>

  <!-- FLOATING BADGE 1 (TOP LEFT - OUTSIDE WINDOW, NO OVERLAP) -->
  <g transform="translate(15, 25)" filter="url(#softShadow)">
    <rect width="190" height="52" rx="26" fill="#140726" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="28" cy="26" r="14" fill="url(#purpleGlow)"/>
    <path d="M 23 26 L 27 30 L 34 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff">Certified Pros</text>
    <text x="50" y="38" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#ff6b00">100% Background Check</text>
  </g>

  <!-- FLOATING BADGE 2 (BOTTOM RIGHT - OUTSIDE WINDOW, NO OVERLAP) -->
  <g transform="translate(595, 520)" filter="url(#orangeGlow)">
    <rect width="190" height="52" rx="26" fill="#140726" stroke="#ff6b00" stroke-width="2"/>
    <circle cx="28" cy="26" r="14" fill="url(#orangeFlame)"/>
    <circle cx="28" cy="26" r="5" fill="#ffffff"/>
    <text x="50" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff">Stripe Protected</text>
    <text x="50" y="38" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#c084fc">Instant Secure Booking</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="genBg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="32" fill="url(#genBg)"/>
  <circle cx="100" cy="100" r="140" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Toolbox and Cross Tools -->
  <g transform="translate(180, 80)">
    <!-- Toolbox Body -->
    <rect x="50" y="120" width="240" height="150" rx="20" fill="url(#boxGrad)"/>
    <rect x="70" y="100" width="200" height="30" rx="10" fill="#d97706"/>
    <!-- Handle -->
    <path d="M 120 100 L 120 60 L 220 60 L 220 100" stroke="#fef08a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="140" y="170" width="60" height="50" rx="10" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 170 185 L 170 205 M 160 195 L 180 195" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="40" width="160" height="44" rx="22" fill="#ffffff" fill-opacity="0.2"/>
  <text x="120" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">GENERAL REPAIR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="plumBgPurple" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dropOrange" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="32" fill="url(#plumBgPurple)"/>
  <circle cx="500" cy="80" r="140" fill="#a855f7" fill-opacity="0.12"/>

  <!-- Water Drop in Flame Orange -->
  <path d="M 450 140 C 450 140 480 180 480 200 C 480 216.5 466.5 230 450 230 C 433.5 230 420 216.5 420 200 C 420 180 450 140 450 140 Z" fill="url(#dropOrange)"/>

  <!-- Pipe System -->
  <g stroke="#a855f7" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 120 260 L 260 260 L 260 140 L 380 140"/>
  </g>
  <circle cx="260" cy="260" r="26" fill="#ff6b00"/>
  <circle cx="260" cy="140" r="26" fill="#ff6b00"/>

  <!-- Wrench Tool -->
  <g transform="translate(260, 160) rotate(-35)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#ff6b00"/>
    <circle cx="160" cy="16" r="28" fill="#7c3aed"/>
    <circle cx="160" cy="16" r="14" fill="#ffffff"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="40" width="160" height="44" rx="22" fill="#181024" stroke="#ff6b00" stroke-width="2"/>
  <text x="120" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff">PLUMBING</text>
</svg>
